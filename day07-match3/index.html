        <button class="tog" data-opt="bgm" aria-label="배경음">

        </button>
      </div>
      <div class="opt">
        <span>효과음</span>
        <button class="tog" data-opt="sfx" aria-label="효과음">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>

      <button class="btn" id="optClose">닫기</button>

  </div>

      <p class="sub">DAY 07</p>

    <div class="itembar">
      <div class="gold"><span class="coin"></span><span id="gold">0</span></div>
      <div class="items" id="items">
        <button class="item" data-item="hammer">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6-2.5 2.5-6-6z"/><path d="M11.5 6.5L3.5 14.5a2.1 2.1 0 0 0 3 3l8-8"/></svg></span>

          <span class="nm">십자</span><span class="cnt">0</span>
        </button>
        <button class="item" data-item="color">
          <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 10.5a6 6 0 1 1-12 0C6 9.5 12 3 12 3z"/><path d="M12 10.5l1 2 2 .6-2 .6-1 2-1-2-2-.6 2-.6z" fill="#fff" stroke="none"/></svg></span>
