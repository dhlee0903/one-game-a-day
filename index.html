<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>하루에 게임 1개씩</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --line: #2a3341;
      --text: #e6edf3;
      --dim: #8b949e;
      --accent: #ffd23f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% -10%, #182233, #0d1117 55%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 64px 24px;
    }
    .wrap { max-width: 900px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 48px; }
    h1 {
      font-size: 40px; font-weight: 800; letter-spacing: -0.02em;
      background: linear-gradient(90deg, #58a6ff, #a371f7, #f778ba);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    header p { color: var(--dim); margin-top: 12px; font-size: 15px; }
    .repo {
      display: inline-block; margin-top: 16px; color: var(--dim); font-size: 13px;
      text-decoration: none; border: 1px solid var(--line);
      padding: 6px 14px; border-radius: 999px; transition: color .15s, border-color .15s;
    }
    .repo:hover { color: var(--text); border-color: var(--dim); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }
    .card {
      display: flex; flex-direction: column;
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      padding: 20px; text-decoration: none; color: inherit;
      transition: transform .15s, border-color .15s, box-shadow .15s;
    }
    .card:hover { transform: translateY(-4px); border-color: #3d5a80; box-shadow: 0 16px 40px rgba(0, 0, 0, .4); }
    .top { display: flex; align-items: center; gap: 14px; }
    .thumb {
      flex: none; width: 56px; height: 56px; border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      background: #0d1117; border: 1px solid var(--line);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04);
    }
    .thumb svg { width: 38px; height: 38px; display: block; }
    .head .day { font-size: 11px; letter-spacing: .2em; color: var(--dim); font-weight: 600; }
    .head h2 { font-size: 21px; margin-top: 3px; }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
    .tag {
      font-size: 11px; color: var(--dim); background: #0d1117;
      border: 1px solid var(--line); padding: 3px 9px; border-radius: 6px;
    }
    .hs {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--line);
    }
    .hs .lbl { font-size: 12px; color: var(--dim); }
    .hs .val { font-size: 16px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
    .hs .val.none { color: var(--dim); font-weight: 600; font-size: 13px; }
    .soon {
      opacity: .5; border-style: dashed; align-items: center; justify-content: center;
      min-height: 148px; color: var(--dim); font-size: 14px;
    }
    footer { text-align: center; margin-top: 56px; color: var(--dim); font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>하루에 게임 1개씩</h1>
      <p>매일 웹 게임을 하나씩. 프레임워크 없이 바닐라 JS로.</p>
      <a class="repo" href="https://github.com/dhlee0903/one-game-a-day" target="_blank" rel="noopener">GitHub →</a>
    </header>

    <div class="grid" id="grid"></div>

    <footer>Built with vanilla web tech · no dependencies</footer>
  </div>

  <script>
    // High scores live in localStorage (shared origin with each game page).
    const num = (k) => { try { return Number(localStorage.getItem(k)) || 0; } catch { return 0; } };
    const jsonBest = (k) => { try { return (JSON.parse(localStorage.getItem(k)) || {}).best || 0; } catch { return 0; } };

    // Simple thematic SVG thumbnails (self-contained, no assets).
    const ICON = {
      tetris: `<svg viewBox="0 0 44 44">
        <rect x="6" y="12" width="10" height="10" rx="2" fill="#3aa0ff"/>
        <rect x="16" y="12" width="10" height="10" rx="2" fill="#a371f7"/>
        <rect x="16" y="22" width="10" height="10" rx="2" fill="#3fce6a"/>
        <rect x="26" y="22" width="10" height="10" rx="2" fill="#ffd23f"/></svg>`,
      dice: `<svg viewBox="0 0 44 44">
        <rect x="8" y="8" width="28" height="28" rx="6" fill="#e7edf4" stroke="#aeb9c8"/>
        <circle cx="16" cy="16" r="2.6" fill="#20242c"/><circle cx="28" cy="16" r="2.6" fill="#20242c"/>
        <circle cx="22" cy="22" r="2.6" fill="#ff5a63"/>
        <circle cx="16" cy="28" r="2.6" fill="#20242c"/><circle cx="28" cy="28" r="2.6" fill="#20242c"/></svg>`,
      snake: `<svg viewBox="0 0 44 44" fill="none" stroke="#3fce6a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 10h14v11H14v11h20"/>
        <circle cx="35" cy="32" r="3" fill="#3fce6a" stroke="none"/>
        <rect x="7" y="7" width="6" height="6" rx="1.5" fill="#ffd23f" stroke="none"/></svg>`,
      cards: `<svg viewBox="0 0 44 44">
        <rect x="9" y="9" width="20" height="27" rx="3" fill="#e7edf4" stroke="#aeb9c8" transform="rotate(-9 19 22)"/>
        <rect x="15" y="9" width="20" height="27" rx="3" fill="#fff" stroke="#aeb9c8" transform="rotate(9 25 22)"/>
        <path d="M25 17c3 3 5 4 5 7a3.2 3.2 0 0 1-6.4 0c0-3 2-4 5-7z" fill="#ff5a63" transform="rotate(9 25 22)"/></svg>`,
      platformer: `<svg viewBox="0 0 44 44">
        <path d="M22 7c6 0 11 5 11 11 0 3-2 5-5 5H16c-3 0-5-2-5-5C11 12 16 7 22 7z" fill="#ff5a63"/>
        <circle cx="16" cy="16" r="3" fill="#fff"/><circle cx="28" cy="16" r="3" fill="#fff"/>
        <rect x="15" y="24" width="14" height="13" rx="2" fill="#ffcf9e"/>
        <rect x="15" y="31" width="14" height="6" rx="1" fill="#3aa0ff"/></svg>`,
      runner: `<svg viewBox="0 0 44 44">
        <path d="M22 6 4 38h36z" fill="#161b22" stroke="#2a3341"/>
        <path d="M22 6 16 38M22 6l6 32" stroke="#3d4a5e" stroke-width="1.5"/>
        <rect x="19" y="20" width="6" height="8" rx="2" fill="#ffd23f"/></svg>`,
      match3: `<svg viewBox="0 0 44 44">
        <rect x="7" y="7" width="12" height="12" rx="3" fill="#3fce6a"/>
        <rect x="25" y="7" width="12" height="12" rx="3" fill="#ff5a63"/>
        <rect x="7" y="25" width="12" height="12" rx="3" fill="#3aa0ff"/>
        <circle cx="31" cy="31" r="6.5" fill="#a371f7"/></svg>`,
      baseball: `<svg viewBox="0 0 44 44">
        <circle cx="22" cy="22" r="14" fill="#f2f5f9" stroke="#aeb9c8"/>
        <path d="M13 11c4 4 5 7 5 11s-1 7-5 11M31 11c-4 4-5 7-5 11s1 7 5 11"
              fill="none" stroke="#ff5a63" stroke-width="1.8" stroke-linecap="round"/>
        <text x="22" y="27" text-anchor="middle" font-size="13" font-weight="800"
              font-family="ui-monospace, Menlo, monospace" fill="#20242c">7</text></svg>`,
    };

    const GAMES = [
      { day: '01', dir: 'day01-tetris',    name: '테트리스',    icon: 'tetris',     tags: ['Canvas', 'SRS', 'T-Spin'],           hs: () => num('og-hs-day01'),        unit: '점' },
      { day: '02', dir: 'day02-yacht-dice', name: '야추 다이스', icon: 'dice',       tags: ['vs Bot', 'vs Human', 'Dice'],        hs: () => jsonBest('yacht-dice-stats'), unit: '점' },
      { day: '03', dir: 'day03-snake',      name: '스네이크',    icon: 'snake',      tags: ['Canvas', 'Snake', 'High Score'],     hs: () => num('snake-best'),          unit: '점' },
      { day: '04', dir: 'day04-cards',      name: '카드 게임',   icon: 'cards',      tags: ['Blackjack', 'Chips', 'Hub'],         hs: () => num('cards-chips'),         unit: '칩', lbl: '보유 칩' },
      { day: '05', dir: 'day05-platformer', name: '플랫포머',    icon: 'platformer', tags: ['Canvas', 'Side-scroll', 'Physics'],  hs: () => num('og-hs-day05'),         unit: '점' },
      { day: '06', dir: 'day06-runner',     name: '러너',        icon: 'runner',     tags: ['Canvas', '3-Lane', 'Pseudo-3D'],     hs: () => num('day06-runner-best'),   unit: 'm', lbl: '최고 거리' },
      { day: '07', dir: 'day07-match3',     name: '3매치 퍼즐',  icon: 'match3',     tags: ['Canvas', 'Match-3', '10 Stages'],    hs: () => num('og-hs-day07'),         unit: '점' },
      { day: '08', dir: 'day08-baseball',   name: '숫자야구',    icon: 'baseball',   tags: ['추리', 'S / B', '4자리'],          hs: () => num('og-hs-day08'),         unit: '회', lbl: '최소 시도' },
    ];

    const grid = document.getElementById('grid');
    for (const g of GAMES) {
      const score = g.hs();
      const scoreHtml = score > 0
        ? `<span class="lbl">${g.lbl || '최고 기록'}</span><span class="val">${score.toLocaleString()}${g.unit}</span>`
        : `<span class="lbl">${g.lbl || '최고 기록'}</span><span class="val none">기록 없음</span>`;
      const a = document.createElement('a');
      a.className = 'card';
      a.href = `./${g.dir}/`;
      a.innerHTML = `
        <div class="top">
          <div class="thumb">${ICON[g.icon]}</div>
          <div class="head"><div class="day">DAY ${g.day}</div><h2>${g.name}</h2></div>
        </div>
        <div class="tags">${g.tags.map((t) => `<span class="tag">${t}</span>`).join('')}</div>
        <div class="hs">${scoreHtml}</div>`;
      grid.appendChild(a);
    }

    const soon = document.createElement('div');
    soon.className = 'card soon';
    soon.textContent = 'Day 09 · coming soon';
    grid.appendChild(soon);
  </script>
</body>
</html>
